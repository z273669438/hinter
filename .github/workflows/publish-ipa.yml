name: Publish IPA to Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifact zip via API
        id: dl
        continue-on-error: true
        run: |
          exec > /tmp/step.log 2>&1
          set -x
          ART=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/36445107974/artifacts | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['artifacts'][0]['archive_download_url'])")
          echo "ART=$ART"
          curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" "$ART" -o art.zip
          ls -lh art.zip
          unzip -o art.zip
          find . -maxdepth 1 -type f

      - name: Publish as GitHub Release
        if: steps.dl.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-test-1
          name: Hinter iOS 测试版 1
          body: 未签名 ipa,Sideloadly 签名安装
          files: hinter-unsigned.ipa

      - name: Push step log to diag branch
        if: always()
        run: |
          cd /tmp
          git init diag -q
          cd diag
          git config user.email "ci@hinter.local"
          git config user.name "ci"
          git checkout --orphan diag -q
          cp /tmp/step.log step.log 2>/dev/null || echo "no log" > step.log
          echo "dl_outcome=${{ steps.dl.outcome }}" >> step.log
          git add -A
          git commit -m "diag $GITHUB_RUN_NUMBER" -q
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY.git" diag:diag
