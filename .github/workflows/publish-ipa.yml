name: Publish IPA to Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifact (from run 3)
        uses: dawidd6/action-download-artifact@v7
        with:
          run_id: 36445107974
          name: hinter-ios-unsigned
          path: art

      - name: Extract ipa
        run: |
          cd art
          unzip -o hinter-unsigned.zip
          mv hinter-unsigned.ipa ../hinter-ios-unsigned.ipa
          ls -lh ../hinter-ios-unsigned.ipa

      - name: Publish as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-test-1
          name: Hinter iOS 测试版 1
          body: 未签名 ipa,Sideloadly 签名安装
          files: hinter-ios-unsigned.ipa
