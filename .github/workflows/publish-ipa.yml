name: Publish IPA to Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifact zip via API
        run: |
          set -e
          ART=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/36445107974/artifacts | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['artifacts'][0]['archive_download_url'])")
          curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" "$ART" -o art.zip
          ls -lh art.zip
          unzip -o art.zip
          echo "---- extracted ----"
          find . -maxdepth 1 -type f

      - name: Publish as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-test-1
          name: Hinter iOS 测试版 1
          body: 未签名 ipa,Sideloadly 签名安装
          files: hinter-unsigned.ipa
