name: iOS Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Register Metal source with Xcode target
        id: reg
        continue-on-error: true
        run: |
          ruby - <<'RUBY' | tee /tmp/reg.log
          begin
            require "xcodeproj"
            puts "xcodeproj OK"
            proj = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            puts "targets: " + proj.targets.map(&:name).join(",")
            target = proj.targets.find { |t| t.name == "Runner" } || proj.targets.first
            grp = proj.main_group.find_subpath("Runner", false)
            already = target.source_build_phase.files_references.any? { |r| (r.path || "").include?("hinter.ci.metal") }
            if already
              puts "METAL_ALREADY"
            else
              ref = grp.new_reference("../Kernel/hinter.ci.metal")
              target.source_build_phase.add_file_reference(ref)
              proj.save
              puts "METAL_REGISTERED"
            end
          rescue => e
            puts "REG_ERROR: #{e.class}: #{e.message}"
            exit 2
          end
          RUBY
          grep -qE "METAL_REGISTERED|METAL_ALREADY" /tmp/reg.log

      - name: Build iOS (unsigned)
        id: build
        continue-on-error: true
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA
        if: steps.build.outcome == 'success'
        run: |
          set -e
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          if [ -s build/ios/iphoneos/Runner.app/default.metallib ]; then
            SZ=$(stat -f%z build/ios/iphoneos/Runner.app/default.metallib)
            echo "METALLIB_INJECTED $SZ bytes" > /tmp/metalstatus
          else
            echo "METALLIB_MISSING" > /tmp/metalstatus
          fi
          zip -qr hinter-ios-unsigned.ipa Payload
          unzip -l hinter-ios-unsigned.ipa | grep -q metallib && echo "VERIFIED_IN_ZIP" >> /tmp/metalstatus || echo "NOT_IN_ZIP" >> /tmp/metalstatus

      - name: Publish as GitHub Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-test-1
          name: Hinter iOS 测试版 1
          body: 未签名 ipa,Sideloadly 签名安装
          files: hinter-ios-unsigned.ipa

      - name: Report status as issue
        if: always()
        env:
          GHT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f /tmp/metalstatus ] || echo "NO_STATUS" > /tmp/metalstatus
          { echo "---- reg ----"; tail -12 /tmp/reg.log 2>/dev/null
            echo "---- build-errors ----"
            grep -E "error:" /tmp/build.log 2>/dev/null | grep -iE "metal|expected|unknown|undeclared|no member|too " | head -25
            tail -18 /tmp/build.log 2>/dev/null; } >> /tmp/metalstatus
          python3 - <<'PYX'
          import json, os, urllib.request
          body = open('/tmp/metalstatus', errors='ignore').read()[-1800:]
          first = body.split()[0] if body.split() else 'NA'
          data = json.dumps({"title": "MSTAT run" + os.environ["GITHUB_RUN_NUMBER"] + " " + first,
                             "body": body}).encode()
          req = urllib.request.Request(
            "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/issues",
            data=data, headers={"Authorization": "Bearer " + os.environ["GHT"],
                                "Accept": "application/vnd.github+json"})
          print("issue:", urllib.request.urlopen(req).status)
          PYX
