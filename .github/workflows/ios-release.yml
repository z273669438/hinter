name: iOS Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Register Metal source with Xcode target
        id: reg
        continue-on-error: true
        run: |
          set +e
          ruby - <<'RUBY' | tee /tmp/reg.log
          begin
            require "xcodeproj"
            puts "xcodeproj #{$LOAD_PATH.any? ? "OK" : "?"}"
            proj = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            puts "targets: " + proj.targets.map(&:name).join(",")
            target = proj.targets.find { |t| t.name == "Runner" } || proj.targets.first
            grp = proj.main_group.find_subpath("Runner", false) ||
                  proj.main_group.children.find { |c| c.display_name == "Runner" }
            puts "group: #{grp.class}"
            already = target.source_build_phase.files_references.any? { |r| (r.path || "").include?("hinter.metal") }
            if already
              puts "METAL_ALREADY"
            else
              ref = grp.new_reference("../Kernel/hinter.metal")
              target.source_build_phase.add_file_reference(ref)
              proj.save
              puts "METAL_REGISTERED"
            end
          rescue => e
            puts "REG_ERROR: #{e.class}: #{e.message}"
            exit 2
          end
          RUBY
          grep -qE "METAL_REGISTERED|METAL_ALREADY" /tmp/reg.log

      - name: Build iOS (unsigned)
        id: build
        continue-on-error: true
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA
        if: steps.build.outcome == 'success'
        run: |
          set -e
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          if [ -f build/ios/iphoneos/Runner.app/default.metallib ]; then
            SZ=$(stat -f%z build/ios/iphoneos/Runner.app/default.metallib)
            echo "METALLIB_INJECTED $SZ bytes" | tee /tmp/metalstatus
          else
            echo "METALLIB_MISSING" | tee /tmp/metalstatus
          fi
          zip -qr hinter-ios-unsigned.ipa Payload
          unzip -l hinter-ios-unsigned.ipa | grep metallib && echo "VERIFIED_IN_ZIP" | tee -a /tmp/metalstatus || echo "NOT_IN_ZIP" | tee -a /tmp/metalstatus
          ls -lh hinter-ios-unsigned.ipa

      - name: Report metal status
        if: always()
        env:
          GHT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f /tmp/metalstatus ] || echo "NO_STATUS (build skipped/reg failed)" > /tmp/metalstatus
          { echo "---- reg ----"; tail -14 /tmp/reg.log 2>/dev/null; } >> /tmp/metalstatus
          python3 - <<'PYX'
          import json, os, urllib.request
          body = open('/tmp/metalstatus', errors='ignore').read()[-1400:]
          first = body.split()[0] if body.split() else 'NA'
          data = json.dumps({"title": "MSTAT run" + os.environ["GITHUB_RUN_NUMBER"] + " " + first,
                             "body": body}).encode()
          req = urllib.request.Request(
            "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/issues",
            data=data, headers={"Authorization": "Bearer " + os.environ["GHT"],
                                "Accept": "application/vnd.github+json"})
          print("issue:", urllib.request.urlopen(req).status)
          PYX

      - name: Report build errors as issue
        if: steps.build.outcome == 'failure' || steps.metal.outcome == 'failure'
        env:
          GHT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -iE "error:|fatal" /tmp/build.log | head -60 > /tmp/errs.txt || true
          [ -s /tmp/errs.txt ] || tail -80 /tmp/build.log > /tmp/errs.txt
          [ -f /tmp/metal.log ] && { echo "==== METAL ====" >> /tmp/errs.txt; cat /tmp/metal.log >> /tmp/errs.txt; }
          python3 - <<'PYX'
          import json, os, urllib.request
          body = open('/tmp/errs.txt').read()[-5000:]
          data = json.dumps({'title': 'BERR run' + os.environ['GITHUB_RUN_NUMBER'] + ' sha' + os.environ['GITHUB_SHA'][:7],
                             'body': body}).encode()
          req = urllib.request.Request(
            'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues',
            data=data,
            headers={'Authorization': 'Bearer ' + os.environ['GHT'],
                     'Accept': 'application/vnd.github+json'})
          print('issue http', urllib.request.urlopen(req).status)
          PYX
