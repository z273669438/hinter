name: iOS Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # CI 内核手工编译(不经 Xcode;链接必须 -cikernel,否则 air-lld 报缺符号)
      - name: Compile CI kernel
        id: kern
        continue-on-error: true
        run: |
          set +e
          xcrun -sdk iphoneos metal -fcikernel -c \
            -target air64-apple-ios15.0.0 \
            ios/Kernel/hinter.ci.metal -o /tmp/hinter.ci.air 2>&1 | tee /tmp/kern.log
          xcrun -sdk iphoneos metallib -cikernel /tmp/hinter.ci.air \
            -o /tmp/hinter.metallib 2>&1 | tee -a /tmp/kern.log
          SZ=$(stat -f%z /tmp/hinter.metallib 2>/dev/null || echo 0)
          SYM=$(strings /tmp/hinter.metallib 2>/dev/null | grep -c hinterBeauty || true)
          echo "KERN $SZ bytes sym=$SYM" | tee -a /tmp/kern.log
          [ "$SYM" -ge 1 ] && [ "$SZ" -gt 2048 ]

      - name: Build iOS (unsigned)
        id: build
        continue-on-error: true
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA
        if: steps.build.outcome == 'success'
        run: |
          set -e
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          if [ -s /tmp/hinter.metallib ]; then
            cp -f /tmp/hinter.metallib Payload/Runner.app/default.metallib
          fi
          if [ -s Payload/Runner.app/default.metallib ]; then
            SZ=$(stat -f%z Payload/Runner.app/default.metallib)
            echo "METALLIB_INJECTED $SZ bytes" > /tmp/metalstatus
          else
            echo "METALLIB_MISSING" > /tmp/metalstatus
          fi
          zip -qr hinter-ios-unsigned.ipa Payload
          unzip -l hinter-ios-unsigned.ipa | grep -q metallib && echo "VERIFIED_IN_ZIP" >> /tmp/metalstatus || echo "NOT_IN_ZIP" >> /tmp/metalstatus

      - name: Publish as GitHub Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-test-1
          name: Hinter iOS 测试版 1
          body: 未签名 ipa,Sideloadly 签名安装
          files: hinter-ios-unsigned.ipa

      - name: Report status as issue
        if: always()
        env:
          GHT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f /tmp/metalstatus ] || echo "NO_STATUS" > /tmp/metalstatus
          { echo "---- kern ----"; tail -12 /tmp/kern.log 2>/dev/null
            echo "---- build-errors ----"
            grep -E "error:" /tmp/build.log 2>/dev/null | grep -iE "metal|expected|unknown|undeclared|no member|too |not found|symbol" | head -25
            tail -18 /tmp/build.log 2>/dev/null; } >> /tmp/metalstatus
          python3 - <<'PYX'
          import json, os, urllib.request
          body = open('/tmp/metalstatus', errors='ignore').read()[-1800:]
          first = body.split()[0] if body.split() else 'NA'
          data = json.dumps({"title": "MSTAT run" + os.environ["GITHUB_RUN_NUMBER"] + " " + first,
                             "body": body}).encode()
          req = urllib.request.Request(
            "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/issues",
            data=data, headers={"Authorization": "Bearer " + os.environ["GHT"],
                                "Accept": "application/vnd.github+json"})
          print("issue:", urllib.request.urlopen(req).status)
          PYX
