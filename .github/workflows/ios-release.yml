name: iOS Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Build iOS (unsigned)
        id: build
        continue-on-error: true
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr hinter-ios-unsigned.ipa Payload
          ls -lh hinter-ios-unsigned.ipa

      - name: Publish as GitHub Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-test-1
          name: Hinter iOS 测试版 1
          body: 未签名 ipa,Sideloadly 签名安装
          files: hinter-ios-unsigned.ipa

      - name: Report build errors as issue
        if: steps.build.outcome == 'failure'
        env:
          GHT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -iE "error:|fatal" /tmp/build.log | head -60 > /tmp/errs.txt || true
          [ -s /tmp/errs.txt ] || tail -80 /tmp/build.log > /tmp/errs.txt
          python3 - <<'PYX'
          import json, os, urllib.request
          body = open('/tmp/errs.txt').read()[-5000:]
          data = json.dumps({'title': 'BERR run' + os.environ['GITHUB_RUN_NUMBER'] + ' sha' + os.environ['GITHUB_SHA'][:7],
                             'body': body}).encode()
          req = urllib.request.Request(
            'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues',
            data=data,
            headers={'Authorization': 'Bearer ' + os.environ['GHT'],
                     'Accept': 'application/vnd.github+json'})
          print('issue http', urllib.request.urlopen(req).status)
          PYX
